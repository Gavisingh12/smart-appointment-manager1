<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Care Cliniq share card">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A10"/>
      <stop offset="50%" stop-color="#0B2B1B"/>
      <stop offset="100%" stop-color="#081E13"/>
    </linearGradient>
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#135234"/>
      <stop offset="100%" stop-color="#229660"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="120" r="220" fill="#229660" opacity="0.12"/>
  <circle cx="160" cy="560" r="260" fill="#135234" opacity="0.20"/>

  <!-- Logo Emblem -->
  <g transform="translate(80, 80)">
    <rect width="96" height="96" rx="28" fill="url(#emblem-grad)"/>
    <path d="M48 20C44.69 20 42 22.69 42 26V42H26C22.69 42 20 44.69 20 48C20 51.31 22.69 54 26 54H42V70C42 73.31 44.69 76 48 76C51.31 76 54 73.31 54 70V54H70C73.31 54 76 51.31 76 48C76 44.69 73.31 42 70 42H54V26C54 22.69 51.31 20 48 20Z" fill="#FFFFFF"/>
    <path d="M35 48H41.5L45.5 38L50.5 58L54.5 48H61" stroke="#0E482C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="195" y="148" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">Care<tspan fill="#34D399">Cliniq</tspan></text>
  
  <text x="80" y="270" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Smart Health Companion for Every Doctor Visit</text>
  <text x="80" y="340" fill="#CBD5E1" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="26" font-weight="400">1-Minute Doctor Summaries &bull; Find Local Hospitals &bull; Organize Medications</text>

  <!-- Badges -->
  <g transform="translate(80, 430)">
    <rect width="260" height="58" rx="29" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="32" y="36" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="600">100% Private Health</text>
  </g>
  <g transform="translate(365, 430)">
    <rect width="280" height="58" rx="29" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="32" y="36" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="600">1-Minute Doctor Notes</text>
  </g>
  <g transform="translate(670, 430)">
    <rect width="260" height="58" rx="29" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="32" y="36" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="600">Verified Clinics</text>
  </g>
