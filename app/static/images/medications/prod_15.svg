<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="capBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="280" height="200" rx="16" fill="url(#bgGrad)"/>
  
  <g filter="url(#cardShadow)">
    <rect x="45" y="28" width="190" height="144" rx="12" fill="url(#foilGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="49" y="32" width="182" height="38" rx="8" fill="url(#capBrand)"/>
    <text x="60" y="51" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Pantocid DSR Capsu</text>
    <text x="60" y="63" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5">Pantoprazole 40 mg + D</text>
    
    <!-- 6 Capsule Slots -->
    <g transform="translate(68, 80)">
      <!-- Cap 1 -->
      <rect x="0" y="0" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="0" y="14" width="14" height="16" rx="7" fill="#F59E0B"/>
      <!-- Cap 2 -->
      <rect x="46" y="0" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="46" y="14" width="14" height="16" rx="7" fill="#F59E0B"/>
      <!-- Cap 3 -->
      <rect x="92" y="0" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="92" y="14" width="14" height="16" rx="7" fill="#F59E0B"/>
      <!-- Cap 4 -->
      <rect x="134" y="0" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="134" y="14" width="14" height="16" rx="7" fill="#F59E0B"/>
      
      <!-- Row 2 -->
      <rect x="23" y="44" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="23" y="58" width="14" height="16" rx="7" fill="#F59E0B"/>
      <rect x="69" y="44" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="69" y="58" width="14" height="16" rx="7" fill="#F59E0B"/>
      <rect x="113" y="44" width="14" height="16" rx="7" fill="#D97706"/>
      <rect x="113" y="58" width="14" height="16" rx="7" fill="#F59E0B"/>
    </g>
  </g>
</svg>