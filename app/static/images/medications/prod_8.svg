<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="45%" stop-color="#B45309"/>
      <stop offset="80%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="280" height="200" rx="16" fill="url(#bgGrad)"/>
  
  <g filter="url(#cardShadow)" transform="translate(100, 15)">
    <!-- Cap -->
    <rect x="25" y="0" width="30" height="18" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <line x1="28" y1="6" x2="52" y2="6" stroke="#CBD5E1"/>
    <line x1="28" y1="12" x2="52" y2="12" stroke="#CBD5E1"/>
    <!-- Neck -->
    <rect x="30" y="18" width="20" height="12" fill="#78350F"/>
    <!-- Body -->
    <rect x="10" y="30" width="60" height="135" rx="12" fill="url(#glassGrad)"/>
    <!-- Liquid Highlight -->
    <path d="M15 42 Q40 46 65 42 L65 155 Q40 162 15 155 Z" fill="#D97706" opacity="0.4"/>
    
    <!-- Label -->
    <rect x="12" y="65" width="56" height="75" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="14" y="67" width="52" height="14" fill="#0284C7"/>
    <text x="40" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">SYRUP</text>
    <text x="40" y="94" fill="#0F172A" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Ascoril D </text>
    <text x="40" y="104" fill="#64748B" font-family="sans-serif" font-size="5.5" text-anchor="middle">Dextromethor</text>
    <circle cx="40" cy="120" r="7" fill="#0D9488" fill-opacity="0.2"/>
    <path d="M40 115 v10 M35 120 h10" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>